<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lavannya Pradeep Rathod — Data Analyst and Machine Learning enthusiast. Python, SQL, Scikit-learn, Power BI. Portfolio of projects in ML, AI, and data analysis." />
  <title>{% block title %}Lavannya Rathod — Data Analyst & ML Portfolio{% endblock %}</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- ── Navigation ──────────────────────────────────────── -->
  <header class="site-header" id="top" role="banner">
    <nav class="nav container" aria-label="Primary navigation">
      <a class="nav-logo" href="#hero">Lavannya Rathod</a>

      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Open navigation menu">
        <span class="burger"></span>
        <span class="burger"></span>
        <span class="burger"></span>
      </button>

      <ul class="nav-links" id="navMenu" role="list">
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#certifications">Certifications</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ── Page content ─────────────────────────────────────── -->
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ───────────────────────────────────────────── -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-name">Lavannya Pradeep Rathod</span>
      <span class="footer-copy">&copy; 2025. All rights reserved.</span>
      <a class="footer-top" href="#top" aria-label="Back to top">↑ Back to top</a>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
