<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lavannya Pradeep Rathod — Software Engineer, Data Science & AI. Python, SQL, Scikit-learn, Power BI, REST APIs. Portfolio of projects in ML, AI, and full-stack engineering." />
  <title>{% block title %}Lavannya Rathod — Software Engineer · Data Science · AI Portfolio{% endblock %}</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- Interactive & ambient background system -->
  <div class="bg-decorations" aria-hidden="true">
    <div class="cursor-spotlight" id="cursorSpotlight"></div>
    <canvas id="bgCanvas" class="bg-canvas"></canvas>
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>
    <div class="bg-blob bg-blob-4"></div>
    <div class="bg-grid-pattern"></div>
    <div class="geo-shape geo-ring-1"></div>
    <div class="geo-shape geo-ring-2"></div>
    <div class="geo-cross geo-cross-1">+</div>
    <div class="geo-cross geo-cross-2">+</div>
    <div class="geo-cross geo-cross-3">+</div>
  </div>

  <!-- ── Navigation ──────────────────────────────────────── -->
  <header class="site-header" id="top" role="banner">
    <nav class="nav container" aria-label="Primary navigation">
      <a class="nav-logo" href="#hero">Lavannya Rathod</a>

      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Open navigation menu">
        <span class="burger"></span>
        <span class="burger"></span>
        <span class="burger"></span>
      </button>

      <ul class="nav-links" id="navMenu" role="list">
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#certifications">Certifications</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ── Page content ─────────────────────────────────────── -->
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ───────────────────────────────────────────── -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-name">Lavannya Pradeep Rathod</span>
      <span class="footer-copy">&copy; 2025. All rights reserved.</span>
      <a class="footer-top" href="#top" aria-label="Back to top">↑ Back to top</a>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
